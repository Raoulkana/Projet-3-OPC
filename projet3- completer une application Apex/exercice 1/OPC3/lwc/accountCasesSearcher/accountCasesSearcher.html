<template>
    <lightning-card
        title="Recherche de Cas par Sujet"
        icon-name="standard:case">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Rechercher par Sujet"
                value={searchTerm}
                onchange={updateSearchTerm}>
            </lightning-input>

            <lightning-button
                label="Rechercher"
                variant="brand"
                onclick={handleSearch}
                class="slds-m-top_small"
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Chargement des cas"
                    size="medium">
                </lightning-spinner>
            </template>

            <template if:true={error}>
                <p class="slds-text-color_error slds-m-top_small">
                    {error}
                </p>
            </template>

            <template if:true={hasCases}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        data={cases}
                        columns={columns}
                        key-field="Id">
                    </lightning-datatable>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
